# Las pruebas usan H2 en memoria para no depender de MySQL instalado
spring.datasource.url=jdbc:h2:mem:panaderia;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.admin.email=admin@pieroalonso.pe
app.admin.password=Admin12345
app.uploads.dir=target/test-uploads
app.comprobantes.dir=target/test-comprobantes
app.base-url=http://localhost:8080
app.mail.from=no-reply@pieroalonso.pe
# en las pruebas no se limita (cada prueba pide su propio enlace); el limite se prueba aparte
app.recuperacion.max-solicitudes=1000
