spring.application.name=panaderia-piero-alonso
server.port=8080

# Base de datos (las credenciales se pueden sobreescribir con variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/panaderia_piero_alonso?createDatabaseIfNotExist=true&serverTimezone=America/Lima
# Sin valores por defecto: hay que definir DB_USER y DB_PASSWORD (ver README)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Las paginas de error no muestran detalles tecnicos (clases, lineas, rutas del codigo)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Usuario administrador que se crea la primera vez que arranca el sistema
app.admin.email=admin@pieroalonso.pe
# Sin valor por defecto: si ADMIN_PASSWORD no esta definida se genera una clave aleatoria
# y se muestra una sola vez en la consola al crear el administrador
app.admin.password=${ADMIN_PASSWORD:}

# Sesion y transporte
# la sesion se cierra sola tras 10 minutos sin actividad
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
# Con true, todo http se redirige a https (requiere activar SSL, ver application-https.properties)
app.https.forzar=${FORZAR_HTTPS:false}

# Carpeta donde se guardan las fotos que sube el administrador
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
