spring.application.name=panaderia-piero-alonso
server.port=8080

# Base de datos (las credenciales se pueden sobreescribir con variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/panaderia_piero_alonso?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Usuario administrador que se crea la primera vez que arranca el sistema
app.admin.email=admin@pieroalonso.pe
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# Carpeta donde se guardan las fotos que sube el administrador
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
