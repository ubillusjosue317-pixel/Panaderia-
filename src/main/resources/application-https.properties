# Perfil para usar HTTPS. Ejecutar con: -Dspring-boot.run.profiles=https
# Hace falta un keystore (ver README, seccion "HTTPS"); la clave va en una variable de entorno.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD}
app.https.forzar=true
