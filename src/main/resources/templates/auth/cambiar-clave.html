<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body class="pagina-auth movil-login">

<div class="auth-imagen"></div>

<div class="auth-panel">
    <div class="auth-cabecera">
        <a th:href="@{/}" class="marca">
            <span class="marca-icono"><i class="bi bi-basket2-fill"></i></span>
            <span class="marca-movil">Panadería Piero Alonso</span>
        </a>
    </div>

    <div class="auth-cuerpo">
        <h1 class="titulo-pagina">Cambia tu contraseña</h1>
        <p class="texto-gris" th:if="${obligatorio}">Es tu primer ingreso: por seguridad debes reemplazar la
            contraseña temporal antes de continuar.</p>
        <p class="texto-gris" th:unless="${obligatorio}">Elige una contraseña nueva para tu cuenta.</p>

        <form th:action="@{/cambiar-clave}" th:object="${cambio}" method="post" class="form-auth" novalidate>
            <label for="actual" class="form-label">Contraseña actual</label>
            <input type="password" id="actual" th:field="*{actual}" class="form-control"
                   th:errorclass="is-invalid" autocomplete="current-password" required autofocus>
            <div class="invalid-feedback" th:errors="*{actual}"></div>

            <label for="nueva" class="form-label">Contraseña nueva</label>
            <input type="password" id="nueva" th:field="*{nueva}" class="form-control"
                   th:errorclass="is-invalid" autocomplete="new-password"
                   placeholder="8+ caracteres, mayúscula, número y símbolo" required>
            <div class="invalid-feedback" th:errors="*{nueva}"></div>

            <label for="confirmar" class="form-label">Confirmar contraseña nueva</label>
            <input type="password" id="confirmar" th:field="*{confirmar}" class="form-control"
                   th:errorclass="is-invalid" autocomplete="new-password" required>
            <div class="invalid-feedback" th:errors="*{confirmar}"></div>

            <button type="submit" class="boton-guinda">GUARDAR CONTRASEÑA <i class="bi bi-shield-check"></i></button>
        </form>

        <form th:action="@{/logout}" method="post" class="auth-cambiar auth-pie">
            <button type="submit" class="boton-enlace">Cerrar sesión</button>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
