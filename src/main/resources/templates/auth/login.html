<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="fondo-auth">

<main class="container py-5">
    <div class="tarjeta-auth mx-auto">
        <div class="cabecera-auth">
            <a th:href="@{/}" class="text-white text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Volver al catálogo
            </a>
            <h1 class="mt-4 mb-1">Iniciar sesión</h1>
            <p class="mb-0 opacity-75">Bienvenido de vuelta a tu rincón horneado hoy</p>
        </div>

        <div class="cuerpo-auth">
            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                Correo o contraseña incorrectos.
            </div>
            <div th:if="${param.salir}" class="alert alert-secondary py-2 small">
                Cerraste sesión correctamente.
            </div>
            <div th:if="${mensaje}" class="alert alert-success py-2 small" th:text="${mensaje}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="tu.correo@ejemplo.com" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-guinda w-100 py-2">
                    Iniciar sesión <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <p class="text-center small mt-4 mb-0">
                ¿Nuevo cliente? <a th:href="@{/registro}" class="enlace-guinda">Crea tu cuenta aquí</a>
            </p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
