<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="pagina-auth movil-login">

<div class="auth-imagen">
    <a th:href="@{/}"><i class="bi bi-arrow-left"></i> Volver a la tienda</a>
</div>

<div class="auth-panel">
    <div class="auth-cabecera">
        <a th:href="@{/}" class="marca">
            <span class="marca-icono"><i class="bi bi-basket2-fill"></i></span>
            <span class="marca-movil">Panadería Piero Alonso</span>
        </a>
        <a th:href="@{/}" class="auth-cerrar" aria-label="Cerrar"><i class="bi bi-x-lg"></i></a>
    </div>

    <div class="auth-cuerpo">
        <div th:if="${param.error}" class="aviso error">Correo o contraseña incorrectos.</div>
        <div th:if="${param.salir}" class="aviso exito">Cerraste sesión correctamente.</div>
        <div th:if="${param.bloqueado}" class="aviso error">Demasiados códigos incorrectos. Vuelve a iniciar sesión.</div>
        <div th:if="${mensaje}" class="aviso exito" th:text="${mensaje}"></div>

        <h1 class="titulo-pagina">Iniciar Sesión</h1>
        <p class="texto-gris">Bienvenido de vuelta a tu rincón horneado hoy</p>

        <form th:action="@{/login}" method="post" class="form-auth">
            <label for="email" class="form-label">Correo electrónico</label>
            <div class="campo-icono icono-izquierda">
                <span class="icono-campo"><i class="bi bi-person"></i></span>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="usuario@correo.com" required autofocus autocomplete="email">
            </div>

            <label for="password" class="form-label">Contraseña</label>
            <div class="campo-icono icono-derecha">
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required autocomplete="current-password">
                <span class="icono-campo"><i class="bi bi-unlock"></i></span>
            </div>

            <button type="submit" class="boton-guinda">INICIAR SESIÓN <i class="bi bi-arrow-right"></i></button>
        </form>

        <p class="auth-cambiar auth-pie">¿Nuevo cliente? <a th:href="@{/registro}">Crea tu cuenta aquí</a></p>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
