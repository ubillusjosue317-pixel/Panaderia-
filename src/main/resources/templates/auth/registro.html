<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="pagina-auth movil-registro">

<div class="auth-imagen">
    <a th:href="@{/}"><i class="bi bi-arrow-left"></i> Volver a la tienda</a>
</div>

<div class="auth-panel">
    <div class="auth-cabecera">
        <a th:href="@{/}" class="marca">
            <span class="marca-icono"><i class="bi bi-basket2-fill"></i></span>
            <span><small>PANADERÍA</small><b>Piero Alonso</b></span>
        </a>
        <a th:href="@{/}" class="auth-cerrar" aria-label="Cerrar"><i class="bi bi-x-lg"></i></a>
        <a th:href="@{/login}" class="auth-volver solo-movil" aria-label="Volver"><i class="bi bi-chevron-left"></i></a>
    </div>

    <div class="auth-cuerpo">
        <h1 class="titulo-pagina">Registro</h1>
        <p class="texto-gris">Únete a la familia y disfruta del pan caliente en tu mesa</p>

        <!-- Los grupos se ordenan con CSS (order) como en el prototipo -->
        <form th:action="@{/registro}" th:object="${registro}" method="post" class="form-auth" novalidate>
            <div class="grupo-campo grupo-nombre">
                <label class="form-label">NOMBRE COMPLETO</label>
                <div class="row g-2 fila-nombre">
                    <div class="col-sm-6">
                        <div class="campo-icono icono-izquierda">
                            <span class="icono-campo"><i class="bi bi-person"></i></span>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                   th:errorclass="is-invalid" placeholder="Ej. Mateo">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="campo-icono icono-izquierda">
                            <span class="icono-campo"><i class="bi bi-person"></i></span>
                            <input type="text" id="apellido" th:field="*{apellido}" class="form-control"
                                   th:errorclass="is-invalid" placeholder="Ej. Gómez">
                            <div class="invalid-feedback" th:errors="*{apellido}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grupo-campo grupo-email">
                <label for="email" class="form-label">CORREO ELECTRÓNICO</label>
                <div class="campo-icono icono-izquierda">
                    <span class="icono-campo"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:errorclass="is-invalid" placeholder="usuario@correo.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
            </div>

            <div class="grupo-campo grupo-password">
                <label for="password" class="form-label">CONTRASEÑA</label>
                <div class="campo-icono icono-izquierda icono-derecha">
                    <span class="icono-campo"><i class="bi bi-unlock"></i></span>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:errorclass="is-invalid" placeholder="Mínimo 8 caracteres">
                    <button type="button" class="ver-clave" data-campo="password" aria-label="Mostrar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
            </div>

            <div class="grupo-campo grupo-confirmar">
                <label for="confirmarPassword" class="form-label">CONFIRMAR CONTRASEÑA</label>
                <div class="campo-icono icono-izquierda">
                    <span class="icono-campo"><i class="bi bi-shield-check"></i></span>
                    <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" class="form-control"
                           th:errorclass="is-invalid" placeholder="Repite tu contraseña">
                    <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
                </div>
            </div>

            <div class="grupo-campo grupo-telefono">
                <label for="telefono" class="form-label">NÚMERO DE CELULAR</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><span class="bandera"></span>+51</span>
                    <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                           th:errorclass="is-invalid" placeholder="987654321" maxlength="9">
                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                </div>
            </div>

            <div class="grupo-campo grupo-terminos">
                <div class="form-check mt-3">
                    <input type="checkbox" id="aceptaTerminos" th:field="*{aceptaTerminos}"
                           class="form-check-input" th:errorclass="is-invalid">
                    <label for="aceptaTerminos" class="form-check-label small">
                        Acepto los <span class="subrayado-movil">Términos del Servicio</span> y la <span class="subrayado-movil">Política de Privacidad</span>
                    </label>
                    <div class="invalid-feedback" th:errors="*{aceptaTerminos}"></div>
                </div>
            </div>

            <button type="submit" class="boton-guinda">REGISTRARTE <i class="bi bi-arrow-right"></i></button>
        </form>

        <p class="auth-cambiar">¿Ya tienes una cuenta? <a th:href="@{/login}">Iniciar Sesión</a></p>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // ojo para ver u ocultar la contraseña
    document.querySelectorAll(".ver-clave").forEach(function (boton) {
        boton.addEventListener("click", function () {
            const campo = document.getElementById(boton.dataset.campo);
            const visible = campo.type === "text";
            campo.type = visible ? "password" : "text";
            boton.querySelector("i").className = visible ? "bi bi-eye" : "bi bi-eye-slash";
        });
    });
</script>
</body>
</html>
