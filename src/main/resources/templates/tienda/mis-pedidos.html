<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis pedidos')}"></head>
<body>
<aside th:replace="~{fragments/layout :: menu('historial')}"></aside>

<div class="principal">
    <header th:replace="~{fragments/layout :: barra}"></header>

    <main class="contenido">
        <div th:replace="~{fragments/layout :: alertas}"></div>

        <span class="antetitulo">TUS COMPRAS</span>
        <h1 class="titulo-pagina">Mis pedidos</h1>
        <p class="texto-gris">Revisa el estado de tus pedidos.
            ¿Alguna duda? <a th:href="@{/mensajes}" class="enlace-guinda">Escríbenos</a>.</p>

        <div th:if="${#lists.isEmpty(pedidos)}" class="vacio">
            <span class="vacio-icono"><i class="bi bi-receipt"></i></span>
            <h2>Aún no tienes pedidos</h2>
            <p>Cuando confirmes uno, aparecerá aquí.</p>
            <a th:href="@{/explorar}" class="boton-guinda">Ver catálogo</a>
        </div>

        <article class="caja-blanca tarjeta-pedido" th:each="pedido : ${pedidos}">
            <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="me-auto">
                    <h2 th:text="'Pedido #' + ${pedido.id}">Pedido #1</h2>
                    <small class="text-muted"
                           th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')} + ' · ' + (${pedido.tipoEntrega.name() == 'DELIVERY'} ? 'Delivery' : 'Recojo en tienda')">
                        16/10/2026 10:30 · Recojo en tienda
                    </small>
                </div>
                <span class="pastilla" th:text="${pedido.estado.nombre}">Pendiente</span>
                <strong th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</strong>
            </div>
            <ul>
                <li th:each="d : ${pedido.detalles}"
                    th:text="${d.cantidad} + ' × ' + ${d.producto.nombre} + ' (S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)} + ')'">
                    1 × Pan camote
                </li>
            </ul>
            <p th:if="${pedido.direccionEntrega}" class="small text-muted mt-2 mb-0">
                <i class="bi bi-geo-alt"></i> <span th:text="${pedido.direccionEntrega}">Dirección</span>
            </p>
        </article>

        <form th:replace="~{fragments/layout :: salirMovil}"></form>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
