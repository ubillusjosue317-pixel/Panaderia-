<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Explorar')}"></head>
<body>
<aside th:replace="~{fragments/layout :: menu('explorar')}"></aside>

<div class="principal">
    <header th:replace="~{fragments/layout :: barra}"></header>

    <main class="contenido">
        <div th:replace="~{fragments/layout :: alertas}"></div>

        <span class="antetitulo">NUESTRO CATÁLOGO</span>
        <h1 class="titulo-pagina">Explora algo delicioso</h1>
        <p class="texto-gris mb-0">Pan, bollería y pasteles hechos cada mañana en nuestro obrador.</p>

        <div class="filtros">
            <a th:href="@{/explorar(q=${busqueda})}"
               th:classappend="${categoriaActual == null} ? 'elegido'">Todos</a>
            <a th:each="cat : ${categorias}"
               th:href="@{/explorar(categoria=${cat.id}, q=${busqueda})}"
               th:text="${cat.nombre}"
               th:classappend="${categoriaActual == cat.id} ? 'elegido'">Categoría</a>
        </div>

        <p th:if="${busqueda != null and !#strings.isEmpty(busqueda)}" class="texto-gris">
            Resultados para "<strong th:text="${busqueda}">pan</strong>"
        </p>

        <div th:replace="~{fragments/layout :: tarjetas(${productos})}"></div>

        <div th:if="${#lists.isEmpty(productos)}" class="vacio">
            <span class="vacio-icono"><i class="bi bi-search"></i></span>
            <h2>No encontramos productos</h2>
            <p>Prueba con otra palabra o elige otra categoría.</p>
            <a th:href="@{/explorar}" class="boton-guinda">Ver todo el catálogo</a>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
