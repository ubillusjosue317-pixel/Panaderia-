<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<aside th:replace="~{fragments/layout :: menu('admin')}"></aside>

<div class="principal">
    <header th:replace="~{fragments/layout :: barra}"></header>

    <main class="contenido">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 mb-0">Productos</h1>
                <p class="text-muted mb-0 small">Gestión del catálogo, precios, imágenes y disponibilidad</p>
            </div>
            <a th:href="@{/admin/productos/nuevo}" class="btn btn-guinda">
                <i class="bi bi-plus-lg"></i> Nuevo producto
            </a>
        </div>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="tabla-admin">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th class="text-end">Precio</th>
                        <th class="text-center">Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="5" class="text-center text-muted py-4">Aún no hay productos registrados.</td>
                    </tr>
                    <tr th:each="p : ${productos}" th:classappend="${!p.disponible} ? 'fila-inactiva'">
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img class="miniatura-admin" th:alt="${p.nombre}"
                                     th:src="${p.imagenUrl != null} ? @{${p.imagenUrl}} : @{/img/producto-default.svg}"
                                     th:onerror="|this.onerror=null; this.src='@{/img/producto-default.svg}'|">
                                <div>
                                    <strong th:text="${p.nombre}">Pan camote</strong>
                                    <div class="small text-muted text-truncate" style="max-width: 280px"
                                         th:text="${p.descripcion}">Descripción</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${p.categoria.nombre}">Panadería</td>
                        <td class="text-end">
                            <!-- cambio rapido de precio sin entrar a editar -->
                            <form th:action="@{/admin/productos/{id}/precio(id=${p.id})}" method="post"
                                  class="form-precio">
                                <span>S/</span>
                                <input type="number" name="precio" step="0.01" min="0" max="999999.99" required
                                       class="form-control form-control-sm" th:value="${p.precio}"
                                       th:aria-label="'Precio de ' + ${p.nombre}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" title="Guardar precio">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </form>
                        </td>
                        <td class="text-center">
                            <span th:if="${p.disponible}" class="badge text-bg-success">Disponible</span>
                            <span th:unless="${p.disponible}" class="badge text-bg-secondary">Oculto</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/admin/productos/{id}/editar(id=${p.id})}"
                               class="btn btn-sm btn-outline-secondary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/productos/{id}/disponibilidad(id=${p.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary"
                                        th:title="${p.disponible} ? 'Ocultar del catálogo' : 'Mostrar en el catálogo'">
                                    <i class="bi" th:classappend="${p.disponible} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <form th:replace="~{fragments/layout :: salirMovil}"></form>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
