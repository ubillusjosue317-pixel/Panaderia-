<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${producto.id == null} ? 'Nuevo producto' : 'Editar producto')}"></head>
<body>
<aside th:replace="~{fragments/layout :: menu('admin')}"></aside>

<div class="principal">
    <header th:replace="~{fragments/layout :: barra}"></header>

    <main class="contenido" style="max-width: 760px">
        <a th:href="@{/admin/productos}" class="text-decoration-none small enlace-guinda">
            <i class="bi bi-arrow-left"></i> Volver a productos
        </a>
        <h1 class="h3 mt-2 mb-4" th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post"
                      enctype="multipart/form-data" novalidate>
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                   th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="precio" class="form-label">Precio (S/)</label>
                            <input type="number" id="precio" th:field="*{precio}" class="form-control"
                                   th:errorclass="is-invalid" step="0.01" min="0">
                            <div class="invalid-feedback" th:errors="*{precio}"></div>
                        </div>

                        <div class="col-md-8">
                            <label for="idCategoria" class="form-label">Categoría</label>
                            <select id="idCategoria" th:field="*{idCategoria}" class="form-select"
                                    th:errorclass="is-invalid">
                                <option value="">Selecciona...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{idCategoria}"></div>
                        </div>
                        <div class="col-12">
                            <label for="archivoImagen" class="form-label">Imagen</label>
                            <div class="d-flex align-items-center gap-3">
                                <img id="vistaPrevia" class="miniatura-admin grande" alt="Vista previa"
                                     th:src="${!#strings.isEmpty(producto.imagenUrl)} ?@{${producto.imagenUrl}} : @{/img/producto-default.svg}"
                                     th:onerror="|this.onerror=null; this.src='@{/img/producto-default.svg}'|">
                                <div class="flex-grow-1">
                                    <input type="file" id="archivoImagen" name="archivoImagen" class="form-control"
                                           accept="image/jpeg,image/png,image/webp"
                                           th:classappend="${#fields.hasErrors('imagenUrl')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{imagenUrl}"></div>
                                    <div class="form-text">JPG, PNG o WEBP de hasta 5 MB. Si no eliges otra, se mantiene la actual.</div>
                                </div>
                            </div>
                            <!-- la imagen actual se conserva si no suben una nueva -->
                            <input type="hidden" th:field="*{imagenUrl}">
                        </div>

                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3"
                                      th:errorclass="is-invalid"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input type="checkbox" id="disponible" th:field="*{disponible}" class="form-check-input">
                                <label for="disponible" class="form-check-label">Mostrar en el catálogo</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/admin/productos}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-guinda">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // muestra la foto elegida antes de guardar y avisa si pesa mas de 5 MB
    document.getElementById('archivoImagen').addEventListener('change', function () {
        const archivo = this.files[0];
        if (!archivo) {
            return;
        }
        if (archivo.size > 5 * 1024 * 1024) {
            alert('La imagen no puede pesar más de 5 MB.');
            this.value = '';
            return;
        }
        document.getElementById('vistaPrevia').src = URL.createObjectURL(archivo);
    });
</script>
</body>
</html>
