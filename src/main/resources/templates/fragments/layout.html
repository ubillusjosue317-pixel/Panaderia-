<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Panadería Piero Alonso'">Panadería Piero Alonso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark barra-principal sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="logo-circulo"><i class="bi bi-basket2-fill"></i></span>
            Panadería Piero Alonso
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Catálogo</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/admin/productos}">Productos</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-sm btn-outline-light" th:href="@{/login}">Iniciar sesión</a>
                <a class="btn btn-sm btn-crema" th:href="@{/registro}">Crear cuenta</a>
            </div>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-white-50 small">
                    Hola, <strong class="text-white" sec:authentication="principal.nombre">Usuario</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<footer th:fragment="footer" class="pie-pagina mt-5">
    <div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2 small">
        <span>&copy; 2026 Panadería Piero Alonso</span>
        <span>Horneado todos los días en Los Olivos</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
